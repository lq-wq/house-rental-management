name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      PYTHONIOENCODING: utf-8

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Generate house icon
      run: python generate_icon.py

    - name: Build EXE with PyInstaller
      run: pyinstaller --onefile --windowed --name "HouseRentalManager" --icon "house.ico" --add-data "house.ico;." main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: HouseRentalManager-Windows-x64
        path: dist/HouseRentalManager.exe

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: House Rental Manager v2.0 (Build ${{ github.run_number }})
        files: dist/HouseRentalManager.exe
        generate_release_notes: true
        body: |
          Auto-build #${{ github.run_number }}

          Features:
          - Property management (community, building/unit/room, layout)
          - Contract & Tenant management (merged)
          - Payment records with auto-generated next due date
          - Payment frequency: Monthly/Quarterly/Semi-Annual/Annual
          - Dashboard with payment reminders
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
