name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      PYTHONIOENCODING: utf-8

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: 生成房子图标
      run: python generate_icon.py

    - name: 使用 PyInstaller 构建 EXE（使用 spec 文件）
      run: pyinstaller build.spec

    - name: 验证构建产物
      run: |
        echo "检查生成的 EXE 文件..."
        if exist "dist\房屋租赁管理系统.exe" (echo ✓ EXE 文件已生成) else (echo ✗ EXE 文件未找到 & exit /1)
        dir /s dist\

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: 房屋租赁管理系统-Windows-x64
        path: dist/房屋租赁管理系统.exe

    - name: 创建 Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: 房屋租赁管理系统 v2.0 (Build ${{ github.run_number }})
        files: dist/房屋租赁管理系统.exe
        generate_release_notes: true
        body: |
          自动构建 #${{ github.run_number }}

          功能：
          - 房源管理（小区名称、栋/单元/号、户型）
          - 合同与租客管理（合并）
          - 缴费记录（自动生成下次缴费时间）
          - 缴费周期：月付/季付/半年付/年付
          - 仪表盘（含缴费提醒）
          - 数据库备份与恢复
          - CSV 导入导出
          - 按楼栋统计 / 自定义时间统计
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
