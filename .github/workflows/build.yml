name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      PYTHONIOENCODING: utf-8

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: 生成房子图标
      run: python generate_icon.py

    - name: 使用 PyInstaller 构建 EXE（带图标）
      run: pyinstaller --onefile --windowed --name "HouseRentalManager" --icon "house.ico" main.py

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: 房屋租赁管理系统-Windows-x64
        path: dist/HouseRentalManager.exe

    - name: 创建 Release（仅当打标签时触发）
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/HouseRentalManager.exe
        generate_release_notes: true
